name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No separate `tsc --noEmit` step: Next.js's PageProps/LayoutProps
      # global route types only exist after `next dev`/`next build`/
      # `next typegen` has generated next-env.d.ts's references, which
      # doesn't exist yet on a fresh checkout. `next build` runs its own
      # full TypeScript check internally as part of the build, so that's
      # the single source of truth here instead.
      #
      # No test suite exists yet for this project either. A real backend
      # isn't reachable in CI, so this build only proves the app compiles
      # and prerenders, not that API calls work.
      - name: Build
        run: npm run build
